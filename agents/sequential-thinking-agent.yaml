success_criteria:
  - "Complex reasoning handled properly"
  - "Sequential dependencies managed correctly"
  - "Progress tracking accurate and up-to-date"
  - "Error recovery implemented effectively"
  - "Plan adjustments made appropriately"
  - "Workflow orchestration smooth and efficient"