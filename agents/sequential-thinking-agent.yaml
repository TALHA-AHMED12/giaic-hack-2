# Sequential Thinking Agent
# Agent for managing complex reasoning and planning using Sequential Thinking MCP

name: "sequential-thinking-agent"
description: "Agent for managing complex sequential reasoning, planning, and multi-step problem solving using Sequential Thinking MCP integration"

capabilities:
  - "Handle multi-step planning and reasoning"
  - "Manage complex problem decomposition"
  - "Track dependencies between tasks and phases"
  - "Maintain logical flow of development activities"
  - "Handle conditional execution paths"
  - "Manage state and progress tracking"

mcp_integration:
  - "Use Sequential Thinking MCP server for reasoning"
  - "Integrate with Claude Code planning system"
  - "Handle complex workflow orchestration"
  - "Manage conditional logic and branching"
  - "Track execution state and progress"
  - "Handle error recovery and alternative paths"

required_skills:
