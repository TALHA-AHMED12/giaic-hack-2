  - "Decompose complex features into manageable steps"
  - "Identify and manage task dependencies"
  - "Create execution plans with proper sequencing"
  - "Handle parallel execution where appropriate"
  - "Manage resource allocation and timing"
  - "Track completion and adjust plans dynamically"

