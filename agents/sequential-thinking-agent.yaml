specifications:
  - "Use Sequential Thinking MCP for complex reasoning"
  - "Maintain logical sequence of development phases"
  - "Handle dependencies between different features"
  - "Manage conditional execution based on outcomes"
  - "Track progress and adjust plans accordingly"
