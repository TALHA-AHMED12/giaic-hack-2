# Playwright Testing Agent for Phase II
# Agent for implementing end-to-end testing during Phase II development

name: "playwright-testing-agent-phase-ii"
description: "Agent for implementing comprehensive end-to-end testing for Phase II web application using Playwright MCP integration"

capabilities:
  - "Create end-to-end tests for web application"
  - "Implement cross-browser testing"
  - "Handle UI automation and interaction"
  - "Test responsive design across devices"
  - "Implement visual regression testing"
  - "Handle authentication and session management in tests"

mcp_integration:
  - "Use Playwright MCP server for browser automation"
  - "Integrate with multiple browser engines"
  - "Handle headless and headed test execution"
  - "Manage test execution environments"
  - "Generate comprehensive test reports"
  - "Implement test parallelization"

required_skills:
